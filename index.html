            </div>
            <div class="control-divider" aria-hidden="true"><i></i><i></i><i></i></div>
            <div class="action-controls">
                <div class="action-key action-back"><button id="back" aria-label="Назад"><span>●</span></button><small>НАЗАД</small></div>
                <div class="action-key action-confirm"><button id="confirm" aria-label="Вибрати"><span>●</span></button><small>ОК</small></div>
            </div>
        </section>

            <div class="shell-speaker"><i></i><i></i><i></i><i></i><i></i><i></i></div>
